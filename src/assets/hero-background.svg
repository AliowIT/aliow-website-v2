<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"
     style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #021d33; z-index: -1;">
  <defs>
    <!-- Gradient for lines fading out -->
    <linearGradient id="lineGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFFE4C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#BFFE4C" stop-opacity="0"/>
    </linearGradient>

    <!-- Horizontal wave path -->
    <path id="wavePath" d="M 0 0 Q 25 20 50 0 T 100 0" />

    <!-- Vertical wave path -->
    <path id="vWavePath" d="M 0 0 Q 20 25 0 50 T 0 100" />
  </defs>

  <!-- Horizontal flowing wave lines -->
  <g stroke="url(#lineGradient)" fill="none">
    <use href="#wavePath" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 -20" to="0 120"
                        dur="10s" repeatCount="indefinite" />
    </use>
    <use href="#wavePath" stroke-width="0.5" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 -60" to="0 120"
                        dur="12s" repeatCount="indefinite" />
    </use>
    <use href="#wavePath" stroke-width="0.3" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 120"
                        dur="14s" repeatCount="indefinite" />
    </use>
    <use href="#wavePath" stroke-width="0.4" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" from="0 -150" to="0 120"
                        dur="16s" repeatCount="indefinite" />
    </use>
  </g>

  <!-- Vertical flowing lines -->
  <g stroke="url(#lineGradient)" fill="none">
    <use href="#vWavePath" stroke-width="0.4" transform="translate(20 -100)">
      <animateTransform attributeName="transform" type="translate" from="20 -100" to="20 120"
                        dur="12s" repeatCount="indefinite" />
    </use>
    <use href="#vWavePath" stroke-width="0.3" opacity="0.4" transform="translate(40 -120)">
      <animateTransform attributeName="transform" type="translate" from="40 -120" to="40 130"
                        dur="14s" repeatCount="indefinite" />
    </use>
    <use href="#vWavePath" stroke-width="0.5" opacity="0.2" transform="translate(60 -140)">
      <animateTransform attributeName="transform" type="translate" from="60 -140" to="60 140"
                        dur="18s" repeatCount="indefinite" />
    </use>
    <use href="#vWavePath" stroke-width="0.4" opacity="0.3" transform="translate(80 -160)">
      <animateTransform attributeName="transform" type="translate" from="80 -160" to="80 150"
                        dur="20s" repeatCount="indefinite" />
    </use>
  </g>
</svg>
